<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razan Bhandary | Best Frontend Developer</title>

    <!-- Google Search Console Verification -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #0f172a;
            --dark: #020617;
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --card-bg: #1e293b;
            --whatsapp: #25d366;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--dark);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navbar */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(2, 6, 23, 0.95);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .menu-btn {
            display: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: white;
        }

        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 120px 25px 80px;
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
        }

        .hero-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        .hero-text h1 {
            font-size: 3.4rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 15px;
        }

        .hero-text h1 span {
            color: var(--primary);
        }

        .hero-text h2 {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 20px;
        }

        .hero-text p {
            color: var(--text-light);
            font-size: 1.1rem;
            margin-bottom: 35px;
            max-width: 500px;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            margin-left: 15px;
        }

        .btn-outline:hover {
            background: var(--primary);
        }

        .hero-img {
            text-align: center;
        }

        .hero-img .avatar {
            width: 340px;
            height: 340px;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(99, 102, 241, 0.35);
            border: 4px solid var(--primary);
        }

        .hero-img .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            display: block;
            transition: transform 0.4s ease;
        }

        .hero-img .avatar:hover img {
            transform: scale(1.08);
        }

        .hero-img .avatar::after {
            content: '';
            position: absolute;
            inset: -10px;
            border: 3px solid rgba(99, 102, 241, 0.4);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Sections Common */
        section {
            padding: 100px 25px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .section-title h2 span {
            color: var(--primary);
        }

        .section-title p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        /* About */
        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .about-text p {
            color: var(--text-light);
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .about-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .info-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        .info-box h4 {
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .info-box p {
            font-weight: 600;
            margin: 0;
        }

        .about-img {
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #334155;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .about-img img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease;
        }

        .about-img:hover img {
            transform: scale(1.03);
        }

        /* Skills */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 25px;
        }

        .skill-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #334155;
            transition: 0.3s;
        }

        .skill-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.15);
        }

        .skill-card i {
            font-size: 2.8rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .skill-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Services */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid #334155;
            transition: 0.3s;
        }

        .service-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
        }

        .service-card i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 20px;
        }

        .service-card h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .service-card p {
            color: var(--text-light);
        }

        /* Projects */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: 0.3s;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .project-img {
            height: 200px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            color: white;
        }

        .project-info {
            padding: 25px;
        }

        .project-info h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .project-info p {
            color: var(--text-light);
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .project-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        /* Contact */
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .contact-info h3 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        .contact-item i {
            font-size: 1.5rem;
            color: var(--primary);
            width: 40px;
        }

        .contact-item a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
        }

        .contact-item a:hover {
            color: var(--primary);
        }

        .contact-form {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 15px 20px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
        }

        .form-group textarea {
            height: 140px;
            resize: none;
        }

        /* Footer */
        footer {
            background: #020617;
            padding: 40px 25px;
            text-align: center;
            border-top: 1px solid #1e293b;
        }

        footer p {
            color: var(--text-light);
        }

        footer .social {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        footer .social a {
            color: var(--text);
            font-size: 1.4rem;
            transition: 0.3s;
        }

        footer .social a:hover {
            color: var(--primary);
        }

        /* Floating WhatsApp */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 65px;
            height: 65px;
            background: var(--whatsapp);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
            z-index: 999;
            transition: 0.3s;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.6);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .hero-content,
            .about-content,
            .contact-wrapper {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .hero-text h1 {
                font-size: 2.5rem;
            }

            .hero-img .avatar {
                width: 260px;
                height: 260px;
            }

            .btn-outline {
                margin-left: 0;
                margin-top: 15px;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background: #0f172a;
                flex-direction: column;
                padding: 20px;
                gap: 15px;
                border-bottom: 1px solid #1e293b;
            }

            .nav-links.active {
                display: flex;
            }

            .menu-btn {
                display: block;
            }

            .about-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
